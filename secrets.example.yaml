# ~/.config/hourly-chime/secrets.yaml にコピーして chmod 600 する。リポジトリに入れない。
# アクセス権に関わる値だけを置く (普段の設定は config.yaml)
calendars:
  # Google カレンダー: 設定 > (カレンダー名) > カレンダーの統合 > 「iCal 形式の非公開 URL」
  private: "https://calendar.google.com/calendar/ical/xxxx%40gmail.com/private-xxxx/basic.ics"
  # 空き時間情報しか共有されていないカレンダーは gas/busy_ics.gs をデプロイした URL
  work: "https://script.google.com/macros/s/DEPLOYMENT_ID/exec?key=KEY"
  # カウントダウン専用カレンダー (config.yaml で countdown: true)
  countdown: "https://calendar.google.com/calendar/ical/xxxx%40group.calendar.google.com/private-xxxx/basic.ics"
