# ~/.config/hourly-chime/config.yaml にコピーして使う
#
# 毎時、正時 N:00 に向けて次のタイミングで鳴らす:
#   5分前   「N時5分前です。」+ N時台に始まる予定
#   2分前   「2分前です。」
#   15秒前  「15秒前です。」
#   正時    ピピピポーン「N時です。」+ N+1時台に始まる予定
# 鳴らす時刻に予定 (終日予定を除く) が入っていれば、読み上げずに音だけ鳴らす:
#   ポポポポポ / ポポ / ポーン / ピピピポーン
# 休日は holiday.hours の正時だけ鳴らす
timezone: Asia/Tokyo

# Google カレンダー: 設定 > (カレンダー名) > カレンダーの統合 > 「iCal 形式の非公開 URL」
calendars:
  - name: private
    url: https://calendar.google.com/calendar/ical/xxxx%40gmail.com/private-xxxx/basic.ics
  - name: work
    url: https://calendar.google.com/calendar/ical/yyyy/public/basic.ics
    busy_only: true  # 予定名は読まず、時間枠 (予定中かどうか) だけ使う
  - name: holiday
    url: https://calendar.google.com/calendar/ical/ja.japanese%23holiday%40group.v.calendar.google.com/public/basic.ics

refresh_minutes: 10  # この時間以内に取得したキャッシュはそのまま使う

quiet_hours:  # 正時がこの範囲なら鳴らさない (日付またぎ可)
  start: "20:00"
  end: "08:00"

# 休日 (calendar に条件に合う終日予定がある日) は hours の正時だけ鳴らし、
# 次の時報までに始まる予定を読む。quiet_hours より優先。
holiday:
  calendar: holiday
  description: "^祝日"  # Google の日本の祝日は、祭日 (クリスマス・銀行休業日等) の説明が「祭日」
  hours: [8, 12, 16, 20]

announce:
  template: "{start}から、{title}です。"  # 使える変数: {start} {title} {calendar}
  max_items: 3

tts:
  engine: sapi  # sapi | voicevox (voicevox 失敗時は sapi にフォールバック)
  sapi:
    voice: Microsoft Haruka Desktop
    rate: 0  # -10..10
  voicevox:
    # WSL2 (NAT) からは Windows の localhost に届かないので、VOICEVOX 側で
    # --host 0.0.0.0 にして Windows ホストの IP を指定する
    url: http://127.0.0.1:50021
    speaker: 3  # ずんだもん (ノーマル)
    speed: 1.0

player: windows  # windows (PowerShell で再生) | paplay (WSLg)
