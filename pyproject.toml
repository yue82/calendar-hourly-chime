[project]
name = "hourly-chime"
version = "0.1.0"
description = "Google カレンダー連動の音声時報 (WSL2 + Windows)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "icalendar>=7.3.0",
    "pyyaml>=6.0.3",
    "recurring-ical-events>=3.8.2",
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
hourly-chime = "hourly_chime.main:main"
